<!DOCTYPE html>
<html>
<body style="background-color: #111; color: #ff0000; font-family: 'Courier New', monospace; transition: 0.1s;">

  <h1 id="status-text">SYSTEM: STABLE</h1>
  <p id="details">Redstone signal: LOW</p>

  <button onclick="detonate()" style="background: #ff0000; color: white; border: none; padding: 15px; cursor: pointer; font-weight: bold;">
    ACTIVATE TNT
  </button>

  <script>
    function detonate() {
      const title = document.getElementById('status-text');
      const info = document.getElementById('details');
      
      // 1. Immediate change
      title.innerText = "FUSE LIT...";
      title.style.color = "white";
      document.body.style.backgroundColor = "#500"; 
      
      // 2. The "Explosion" after 1.5 seconds
      setTimeout(function() {
        title.innerText = "BOOM! SYSTEM CRASHED";
        title.style.color = "#ff0000";
        info.innerText = "Nostalgia Overload. Please restart Minecraft.";
        document.body.style.backgroundColor = "#000";
        // This adds that Red Glow you predicted!
        document.body.style.boxShadow = "inset 0 0 150px #ff0000";
      }, 1500); 
    }
  </script>

</body>
</html>
