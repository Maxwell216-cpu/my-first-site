<!DOCTYPE html>
<html>
<body>

  <h1 id="status-text" style="color: red;">System Status: BROKEN</h1>
  <p>Minecraft Glitch detected...</p>

  <button onclick="fixSystem()" style="padding: 10px; cursor: pointer;">
    Run Repair Script
  </button>

  <script>
    function fixSystem() {
      // 1. Find the broken text
      const status = document.getElementById('status-text');
      
      // 2. Change the text and color
      status.innerText = "System Status: FIXED";
      status.style.color = "green";
      
      // 3. Pop up a message
      alert("Repair complete. You can now punch blocks!");
    }
  </script>

</body>
</html>
